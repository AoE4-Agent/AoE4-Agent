[package]
name = "aoe4-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Taunt watcher and build-order coach for Age of Empires IV"
publish = false

[[bin]]
name = "aoe4-agent"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
ctrlc = "3.4"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"

# rustls on Linux, SChannel on Windows. Splitting the features keeps the
# mingw cross build from needing OpenSSL headers.
[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[target.'cfg(windows)'.dependencies]
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
